# Gera o gráfico de contribuições com a cobrinha (claro e escuro) e publica na branch "output".
name: Gráfico de contribuições

on:
  schedule:
    - cron: "0 6 * * *" # todo dia, 3h no horário de Brasília
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cobrinha
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobrinha.svg?color_snake=#112e4a&color_dots=#ebedf0,#c6dbef,#7fb0dc,#3b7bbf,#112e4a
            dist/cobrinha-escura.svg?color_snake=#6ea8dc&color_dots=#161b22,#0f2a44,#1b4a75,#2f6fa8,#6ea8dc

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
